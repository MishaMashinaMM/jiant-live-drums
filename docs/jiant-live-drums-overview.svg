<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="486" viewBox="0 0 1080 486" role="img" aria-labelledby="title description">
<title id="title">JIANT LIVE DRUMS v0.2 overview</title>
<desc id="description">An overview of JIANT LIVE DRUMS with two independent twelve-pad drum engines, SEQ MIDI mapping, PLAY performance options, and REC control of up to 32 MIDI CC macros per project. Eight voices are shared across all tracks.</desc>

name: Live-only cleanup checks

on:
  push:
    branches:
      - 'cleanup/v03-sequencer-*'
  pull_request:
    branches: [main]
    paths:
      - 'firmware/src/**'
      - 'tests/**'
      - 'web/emu/**'
      - '.github/workflows/live-cleanup-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate UI/fonts/engine headers
        run: |
          pip install Pillow==12.3.0 numpy==2.3.5 fonttools==4.61.1
          python3 -c "import sys; sys.path.insert(0, 'tools'); import build; build.generate()"
      - name: Dedicated 11 live-drum regression tests
        run: bash tests/run_live_drum_tests.sh
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.11
      - name: Live-only WebAssembly smoke test
        run: |
          bash web/emu/build.sh
          node web/emu/live-drums-wasm-test.mjs build/emu/felucca.wasm
      - name: Direct browser emulator functional test
        run: node web/emu/emu_test.mjs build/emu/felucca.wasm

  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install generators
        run: pip install Pillow==12.3.0 numpy==2.3.5 fonttools==4.61.1
      - name: Cache JieLi toolchain and required SDK assets
        uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK/cpu/wl82/tools
          key: jieli-ac79-v1.2.1
      - name: Ensure JieLi build dependencies
        run: |
          retry() { for d in 0 5 15 30 60; do sleep "$d"; "$@" && return 0; done; return 1; }
          T=$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools
          [ -e "$HOME/.jieli/toolchain" ] || retry sh tools/get_toolchain.sh "$HOME/.jieli"
          if [ ! -s "$T/uboot.boot" ] || [ ! -s "$T/cfg_tool.bin" ] || [ ! -s "$T/cfg/eq_cfg_hw.bin" ]; then
            rm -rf "$HOME/fw-AC79_AIoT_SDK"
            retry git clone --filter=blob:none --no-checkout https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
            (cd "$HOME/fw-AC79_AIoT_SDK" && git sparse-checkout set --no-cone /cpu/wl82/tools/uboot.boot /cpu/wl82/tools/cfg_tool.bin /cpu/wl82/tools/cfg/eq_cfg_hw.bin && retry git checkout d179b4484759423312073f5fbb232501aa491047)
          fi
          test -s "$T/uboot.boot" && test -s "$T/cfg_tool.bin" && test -s "$T/cfg/eq_cfg_hw.bin"
      - name: Firmware build and memory report
        env:
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
        run: |
          bash build.sh | tee /tmp/firmware-size.log
          grep -E 'image [0-9]+ B of|RAM code [0-9]+ B' /tmp/firmware-size.log
          if "$JIELI_TOOLCHAIN/common/bin/objdump" -t build/felucca.elf | grep -w sec_stage; then
            echo "ERROR: retired song staging buffer still allocated"
            exit 1
          fi
          if "$JIELI_TOOLCHAIN/common/bin/objdump" -t build/felucca.elf | grep -w 'live.rec_scene'; then
            echo "ERROR: retired song recording scratch still allocated"
            exit 1
          fi
      - name: Export linked firmware symbol inventory
        env:
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
        run: |
          "$JIELI_TOOLCHAIN/common/bin/objdump" -t build/felucca.elf > build/firmware-symbols.txt
          echo '--- Firmware linked symbol table preview ---'
          head -n 35 build/firmware-symbols.txt
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-memory-audit
          path: |
            build/firmware-symbols.txt
            build/felucca.elf
          retention-days: 14
